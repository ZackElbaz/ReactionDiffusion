<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karl Sims Reaction-Diffusion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #menu {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        #menu.closed {
            transform: translateX(-280px);
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0.8;
        }
        h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            border-bottom: 2px solid #fff;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .value {
            float: right;
            color: #0f0;
        }
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover {
            background: #0052a3;
        }
        #paramSelector {
            width: 200px;
            height: 200px;
            background: linear-gradient(to bottom, #001a33 0%, #4d94ff 100%);
            border: 2px solid #fff;
            border-radius: 4px;
            cursor: crosshair;
            position: relative;
            margin: 10px auto;
        }
        #paramCrosshair {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #ff0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .param-labels {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="menu">
        <h3>Controls</h3>

        <div class="control-group">
            <label>Color Map:</label>
            <select id="colorMap">
                <option value="grayscale">Grayscale</option>
                <option value="blue">Blue</option>
                <option value="orange-blue">Orange-Blue</option>
                <option value="green-purple">Green-Purple</option>
                <option value="cyan-magenta">Cyan-Magenta</option>
                <option value="rainbow">Rainbow</option>
                <option value="yellow-blue">Yellow-Blue</option>
                <option value="red-yellow">Red-Yellow</option>
                <option value="teal-orange">Teal-Orange</option>
                <option value="purple-yellow">Purple-Yellow</option>
                <option value="fire">Fire</option>
                <option value="vibrant">Vibrant</option>
            </select>
        </div>

        <div class="control-group">
            <label>Style Map (Gradient):</label>
            <select id="orientation">
                <option value="right-left">Right to Left</option>
                <option value="left-right">Left to Right</option>
                <option value="top-bottom">Top to Bottom</option>
                <option value="bottom-top">Bottom to Top</option>
            </select>
        </div>

        <div class="control-group">
            <label>Feed & Kill Rates:</label>
            <div id="paramSelector">
                <div id="paramCrosshair"></div>
            </div>
            <div class="param-labels">
                <div>Feed (f): <span class="value" id="feedValue">0.055</span></div>
                <div>Kill (k): <span class="value" id="killValue">0.062</span></div>
            </div>
            <div class="param-labels" style="font-size: 10px; margin-top: 5px;">
                <div>X: k (0.014 - 0.065)</div>
                <div>Y: f (0.002 - 0.12)</div>
            </div>
        </div>

        <button id="resetBtn">Reset</button>
    </div>

    <div class="hint">Press 'M' to toggle menu</div>

    <script src="main.js"></script>
</body>
</html>
